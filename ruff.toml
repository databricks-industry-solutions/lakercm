line-length = 88
target-version = "py311"

[lint.per-file-ignores]
# These modules run sys.path.insert() or other side effects before imports
# for Databricks Apps runtime reasons — E402 does not apply.
"reviewer_app/main.py" = ["E402"]
"reviewer_app/migrations/env.py" = ["E402"]
"agent_app/main.py" = ["E402"]

# Migration files are auto-generated by Alembic and follow its conventions
"**/migrations/versions/*.py" = ["E402", "E501"]

# Pipelines ship to SDP serverless with different linting norms
"pipelines/**" = ["E402", "E501", "E741", "F401", "F403", "F405"]

# Databricks notebook-style files use global symbols (dbutils, display,
# spark) that aren't defined in the file but are injected by the runtime.
# `# COMMAND ----------` separators also cause E402 (top-of-file imports).
"**/tests/evaluate_agent.py" = ["E402", "F821", "E712"]
"agent_app/eval/**" = ["E402", "F821", "E712"]
"reviewer_app/tests/test_*.py" = ["F811"]  # pytest fixture redefinitions are intentional
