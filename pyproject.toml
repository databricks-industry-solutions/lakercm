[tool.black]
# Line length matches .pre-commit-config.yaml (88, the black default).
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
    # Auto-generated alembic migrations follow alembic's own conventions
    reviewer_app/migrations/versions
    # Frontend dist
  | reviewer_app/frontend/dist
  | reviewer_app/frontend/node_modules
)/
'''
