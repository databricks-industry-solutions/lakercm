<svg xmlns="http://www.w3.org/2000/svg" width="520" height="144" viewBox="0 0 520 144" role="img" aria-labelledby="lakercm-title lakercm-desc">
  <title id="lakercm-title">LakeRCM</title>
  <desc id="lakercm-desc">A claim document with a check mark and an AI spark, beside the LakeRCM wordmark.</desc>
  <defs>
    <linearGradient id="lakercm-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243F4A"/>
      <stop offset="1" stop-color="#1B3139"/>
    </linearGradient>
    <linearGradient id="lakercm-spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A4D"/>
      <stop offset="1" stop-color="#FF3621"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="8" y="8" width="128" height="128" rx="30" fill="url(#lakercm-badge)"/>

  <!-- Claim document with a folded corner -->
  <path d="M46 30 H84 L106 52 V108 A8 8 0 0 1 98 116 H46 A8 8 0 0 1 38 108 V38 A8 8 0 0 1 46 30 Z" fill="#FFFFFF"/>
  <path d="M84 30 V46 A6 6 0 0 0 90 52 H106 Z" fill="#C9D6DA"/>

  <!-- Extracted fields -->
  <rect x="48" y="52" width="26" height="6" rx="3" fill="#1B3139" opacity="0.28"/>
  <rect x="48" y="64" width="44" height="6" rx="3" fill="#1B3139" opacity="0.28"/>
  <rect x="48" y="76" width="34" height="6" rx="3" fill="#1B3139" opacity="0.28"/>

  <!-- Verified -->
  <circle cx="88" cy="98" r="17" fill="#00A972"/>
  <path d="M80 98.5 L86 104.5 L97 92" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI spark -->
  <path d="M116 16 L120.5 27.5 L132 32 L120.5 36.5 L116 48 L111.5 36.5 L100 32 L111.5 27.5 Z" fill="url(#lakercm-spark)"/>

  <!-- Wordmark -->
  <text x="160" y="92" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#1B3139">Lake<tspan fill="#FF3621">RCM</tspan></text>
</svg>
