# =============================================================================
# LakeRCM Reviewer App — minimal STATIC runtime config (committed to git)
# =============================================================================
# Env vars + command are owned by the BUNDLE app resource
# (bundles/apps/resources/app.yml `config:` block) and ride each deployment —
# CLI >= 0.283.0 propagates them via the Apps Deploy API. Verified live
# (2026-06-10 spike): deployment config OVERRIDES this file's env wholesale.
#
# Only two things live here:
#   1. The on-behalf-of-user authorization block — it has NO bundle-config
#      equivalent (the apps `user_api_scopes` field rejects all-apis /
#      offline_access; it wants granular package.service:permission scopes).
#   2. A fallback command, so an out-of-band `databricks apps deploy` (which
#      DROPS the bundle's deployment config — proven in the same spike) still
#      boots a pod that fails loudly on missing env instead of not booting.
#
# Pod rolls MUST go through `databricks bundle run` (or scripts/deploy_all.py,
# which does) — never raw `databricks apps deploy`.
# =============================================================================

command:
  - python
  - -m
  - uvicorn
  - main:app
  - --host
  - "0.0.0.0"
  - --port
  - "8000"

permissions:
  - permission: user_access_token_authorization
    scopes:
      - all-apis
      - offline_access
